{% extends "base.html" %}

{% block title %}Sign In - CampusConnect{% endblock %}

{% block content %}
<div class="form-card">
  <span class="section-label">Portal Authentication</span>
  <h1>Sign In</h1>
  <p class="text-muted text-sm">Enter your registered academic credentials to continue.</p>

  <form method="post" action="{{ url_for('login', next=request.args.get('next', '')) }}">
    <div class="form-group">
      <label class="form-label" for="email">Institutional Email</label>
      <input class="form-control" type="email" id="email" name="email" required autocomplete="email" placeholder="name@vips.edu">
    </div>

    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <input class="form-control" type="password" id="password" name="password" required autocomplete="current-password" placeholder="Enter password">
    </div>

    <button class="btn btn-primary" type="submit" style="width: 100%; margin-top: 10px;">Sign In</button>
  </form>

  <div style="margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--color-border); text-align: center;">
    <p class="text-sm text-muted">New student? <a href="{{ url_for('register') }}">Create an account</a></p>
    <p class="text-sm text-muted">Faculty accounts are provisioned by the portal administrator.</p>
  </div>
</div>
{% endblock %}
