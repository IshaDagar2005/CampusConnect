{% extends "base.html" %}

{% block title %}Edit Task - CampusConnect{% endblock %}

{% block content %}
<div class="form-card wide">
  <span class="section-label">{{ task.course.course_code }}</span>
  <h1>Edit Academic Task</h1>
  <p class="text-muted text-sm">Update task instructions, submission deadline, or lifecycle status.</p>

  <form method="post" action="{{ url_for('task_edit', task_id=task.task_id) }}">
    <div class="form-group">
      <label class="form-label" for="title">Task Title</label>
      <input class="form-control" type="text" id="title" name="title" value="{{ task.title }}" required>
    </div>

    <div class="grid-2col" style="grid-template-columns: 1fr 1fr; margin-bottom: 0;">
      <div class="form-group">
        <label class="form-label" for="task_type">Task Classification</label>
        <select class="form-select" id="task_type" name="task_type">
          <option value="Assignment" {% if task.task_type == 'Assignment' %}selected{% endif %}>Assignment</option>
          <option value="Project" {% if task.task_type == 'Project' %}selected{% endif %}>Project Milestone</option>
          <option value="Practical" {% if task.task_type == 'Practical' %}selected{% endif %}>Lab Practical Task</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" for="status">Lifecycle Status</label>
        <select class="form-select" id="status" name="status">
          <option value="Draft" {% if task.status == 'Draft' %}selected{% endif %}>Draft (Hidden from students)</option>
          <option value="Published" {% if task.status == 'Published' %}selected{% endif %}>Published (Accepting submissions)</option>
          <option value="Closed" {% if task.status == 'Closed' %}selected{% endif %}>Closed (Submissions locked)</option>
          <option value="Archived" {% if task.status == 'Archived' %}selected{% endif %}>Archived (Past semester)</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label" for="deadline">Submission Deadline</label>
      <input class="form-control" type="datetime-local" id="deadline" name="deadline" value="{{ task.deadline.strftime('%Y-%m-%dT%H:%M') }}" required>
    </div>

    <div class="form-group">
      <label class="form-label" for="description">Instructions and Requirements</label>
      <textarea class="form-textarea" id="description" name="description" rows="6" required>{{ task.description }}</textarea>
    </div>

    <div style="display: flex; gap: 12px; margin-top: 24px;">
      <button class="btn btn-primary" type="submit">Save Changes</button>
      <a class="btn btn-outline" href="{{ url_for('task_detail', task_id=task.task_id) }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
